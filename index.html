<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой Мега-Кликер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none; /* Чтобы текст не выделялся при частых кликах */
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            border: 2px solid #ffffff;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #34495e;
        }

        .counter-container {
            font-size: 3rem;
            font-weight: 900;
            color: #2980b9;
            margin: 15px 0;
            text-shadow: 1px 1px 0px #fff;
        }

        .click-area {
            position: relative;
            display: inline-block;
            margin: 20px 0;
            cursor: pointer;
        }

        /* Главное изображение-кнопка */
        .click-image {
            max-width: 250px;
            width: 100%;
            height: 250px;
            object-fit: cover; /* Чтобы картинка не искажалась, если она квадратная */
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 0.05s ease-in-out;
        }

        /* Эффект сжатия при клике на картинку */
        .click-image:active {
            transform: scale(0.92);
        }

        /* Всплывающие циферки +1 */
        .floating-text {
            position: absolute;
            font-size: 1.8rem;
            font-weight: bold;
            color: #e74c3c;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) translateY(-100px) scale(1.2);
            }
        }

        .level-text {
            font-size: 1rem;
            color: #7f8c8d;
            font-style: italic;
            margin-top: 10px;
        }

        footer {
            margin-top: 25px;
            font-size: 0.8rem;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Тапай картинку!</h1>
        <div class="level-text" id="level">Звание: Новичок</div>
        
        <div class="counter-container" id="counter">0</div>
        
        <div class="click-area" id="clickZone">
            <!-- В src="ИМЯ" укажите точное название вашей картинки на GitHub -->
            <img src="hehehe.jpg" alt="Картинка для кликера" class="click-image" id="targetImg">
        </div>
    </div>

    <footer>Создано на базе GitHub Pages</footer>

    <script>
        let count = 0;
        const counterElement = document.getElementById('counter');
        const levelElement = document.getElementById('level');
        const clickZone = document.getElementById('clickZone');

        clickZone.addEventListener('click', (e) => {
            // Увеличиваем счетчик
            count++;
            counterElement.innerText = count;

            // Обновляем звание в зависимости от кликов
            updateLevel();

            // Создаем красивую всплывающую цифру +1 в месте клика
            createFloatingText(e);
        });

        function updateLevel() {
            if (count >= 500) {
                levelElement.innerText = "Звание: Бог Клик-Мастер 👑";
                levelElement.style.color = "#ef4444";
            } else if (count >= 100) {
                levelElement.innerText = "Звание: Продвинутый Тапер ⚡";
                levelElement.style.color = "#f59e0b";
            } else if (count >= 30) {
                levelElement.innerText = "Звание: Любитель 🎯";
                levelElement.style.color = "#10b981";
            }
        }

        function createFloatingText(e) {
            const rect = clickZone.getBoundingClientRect();
            // Считаем координаты клика относительно картинки
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const text = document.createElement('div');
            text.className = 'floating-text';
            text.innerText = '+1';
            text.style.left = `${x}px`;
            text.style.top = `${y}px`;

            clickZone.appendChild(text);

            // Удаляем элемент после завершения анимации
            setTimeout(() => {
                text.remove();
            }, 600);
        }
    </script>
</body>
</html>
