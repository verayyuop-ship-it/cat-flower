<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кот-Ромашка | Главный Мем Вселенной</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fffde7 0%, #fff9c4 100%);
            color: #3e2723;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(251, 192, 45, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid #fff59d;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-size: 2.5rem;
            color: #fbc02d;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #795548;
            margin-bottom: 30px;
            font-style: italic;
        }

        .image-container {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }

        /* Загружаем изображение напрямую по ссылке */
        .cat-flower-img {
            max-width: 250px;
            width: 100%;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .fact-box {
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            border-left: 5px solid #fbc02d;
            margin-bottom: 25px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .fact-box p {
            font-size: 1rem;
            line-height: 1.5;
            color: #5d4037;
        }

        .btn {
            background: #fbc02d;
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(251, 192, 45, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #f9a825;
            transform: scale(1.05);
            box-shadow: 0 7px 20px rgba(251, 192, 45, 0.6);
        }

        .btn:active {
            transform: scale(0.98);
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #9e9e9e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Кот-Ромашка</h1>
        <div class="subtitle">мяу</div>
        
        <div class="image-container">
            <!-- Ссылка на исходную картинку из вашего запроса -->
            <img src="котромашка.jpg" alt="Желтый кот-ромашка" class="cat-flower-img">
        </div>

        <div class="fact-box">
            <p id="quote">"Я просто цвету и радую этот мир. Не нужно меня срывать, лучше погладь по лепесткам."</p>
        </div>

        <button class="btn" onclick="generateQuote()">Узнать мысли кота</button>
    </div>

    <footer>© 2026 Культ Желтого Кота. Сделано с любовью и ромашками.</footer>

    <script>
        const quotes = [
            "Я просто цвету и радую этот мир. Не нужно меня срывать, лучше погладь по лепесткам.",
            "Любит... Не любит... Конечно любит! Я же кот.",
            "Календула? Одуванчик? Нет, я чистокровная Ромашка кусячьего вида.",
            "Фотосинтез идет успешно, когда в миске есть влажный корм.",
            "Пчелы постоянно путают меня с цветком и очень удивляются, когда я говорю 'Мяу'."
        ];

        function generateQuote() {
            const quoteElement = document.getElementById('quote');
            let randomQuote;
            
            // Чтобы цитаты не повторялись дважды подряд
            do {
                randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            } while (randomQuote === quoteElement.innerText);

            quoteElement.style.opacity = 0;
            setTimeout(() => {
                quoteElement.innerText = randomQuote;
                quoteElement.style.opacity = 1;
            }, 150);
        }
    </script>
</body>
</html>
